name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
      placeholder: When preparing a LinkedIn post, I need...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the tool do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Formatter
        - Preview
        - Checks
        - AI Assist
        - Settings
        - Documentation
        - Public repo/community
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there simpler ways to solve this?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, examples, or LinkedIn behavior notes.
