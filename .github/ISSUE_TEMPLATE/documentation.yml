name: Documentation
description: Suggest a README, help, or docs improvement.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Which page or file needs improvement?
      placeholder: README, Help page, CONTRIBUTING...
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: What should be added, removed, or clarified?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it matters
      description: How would this help users or contributors?
